services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../stockify-api
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/usr/local/bin/api-start.prod.sh"]
    command: []
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      RAILS_LOG_LEVEL: info
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS}
      RAILS_ALLOWED_HOSTS: ${RAILS_ALLOWED_HOSTS}
      RAILS_MAX_THREADS: "5"
    volumes:
      - ./api-start.prod.sh:/usr/local/bin/api-start.prod.sh:ro
      - api-storage:/rails/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/up || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web.prod
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  api-storage:
  caddy-data:
  caddy-config:
